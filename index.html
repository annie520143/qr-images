<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      --viewport-height: 100vh;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: var(--viewport-height);
      background: url("img/BACKGROUND.png") center / cover no-repeat;
    }

    .foreground {
      position: fixed;
      inset: 0;
      width: 100%;
      height: var(--viewport-height);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .foreground img {
      display: block;
      width: auto;
      height: auto;
      max-width: 80vw;
      max-height: 90vh;
      max-height: 90dvh;
      object-fit: contain;
      filter: drop-shadow(2.98px 2.98px 4.92px rgba(0, 0, 0, 0.25));
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true"></div>
  <div class="foreground">
    <img id="p" alt="">
  </div>

  <script>
    function setViewportHeight() {
      document.documentElement.style.setProperty('--viewport-height', window.innerHeight + 'px');
    }

    setViewportHeight();
    window.addEventListener('resize', setViewportHeight);

    const requestedNumber = Number.parseInt(new URLSearchParams(location.search).get('n'), 10);
    const imageNumber = Number.isInteger(requestedNumber) && requestedNumber >= 1 && requestedNumber <= 16
      ? requestedNumber
      : 1;
    const imageName = String(imageNumber).padStart(2, '0');
    document.getElementById('p').src = 'img/人物風格圖-05-' + imageName + '.png';
  </script>
</body>
</html>
