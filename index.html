<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      --viewport-height: 100vh;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: var(--viewport-height);
      background: url("img/BACKGROUND.png") center / cover no-repeat;
    }

    .foreground {
      position: fixed;
      inset: 0;
      width: 100%;
      height: var(--viewport-height);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    .foreground.ready {
      opacity: 1;
    }

    .foreground img {
      display: block;
      width: auto;
      height: auto;
      max-width: 80vw;
      max-height: 90vh;
      max-height: 90dvh;
      object-fit: contain;
    }

    .composite {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: none;
      width: 100%;
      height: var(--viewport-height);
      object-fit: cover;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: default;
    }

    .composite-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: none;
      width: 100%;
      height: var(--viewport-height);
      object-fit: cover;
    }

    .composite.ready,
    .composite-canvas.ready {
      display: block;
    }

    #download {
      display: none;
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 2;
      padding: 10px 16px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: rgba(0, 0, 0, 0.65);
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true"></div>
  <div class="foreground">
    <img id="p" alt="">
  </div>
  <canvas id="compositeCanvas" class="composite-canvas" aria-label=""></canvas>
  <img id="composite" class="composite" alt="">
  <button id="download" type="button">下載圖片</button>

  <script>
    const backgroundSrc = 'img/BACKGROUND.png';
    const foreground = document.querySelector('.foreground');
    const foregroundImage = document.getElementById('p');
    const compositeCanvas = document.getElementById('compositeCanvas');
    const composite = document.getElementById('composite');

    function setViewportHeight() {
      document.documentElement.style.setProperty('--viewport-height', window.innerHeight + 'px');
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
      });
    }

    function drawCover(context, image, width, height, pixelRatio) {
      const scale = Math.max(width / image.naturalWidth, height / image.naturalHeight);
      const drawWidth = image.naturalWidth * scale * pixelRatio;
      const drawHeight = image.naturalHeight * scale * pixelRatio;
      const x = ((width - image.naturalWidth * scale) / 2) * pixelRatio;
      const y = ((height - image.naturalHeight * scale) / 2) * pixelRatio;
      context.drawImage(image, x, y, drawWidth, drawHeight);
    }

    function drawForeground(context, image, width, height, pixelRatio) {
      const scale = Math.min(1, (width * 0.8) / image.naturalWidth, (height * 0.9) / image.naturalHeight);
      const cssWidth = image.naturalWidth * scale;
      const cssHeight = image.naturalHeight * scale;
      const drawWidth = cssWidth * pixelRatio;
      const drawHeight = cssHeight * pixelRatio;
      const x = ((width - cssWidth) / 2) * pixelRatio;
      const y = ((height - cssHeight) / 2) * pixelRatio;

      context.save();
      context.shadowColor = 'rgba(0, 0, 0, 0.25)';
      context.shadowOffsetX = 3 * pixelRatio;
      context.shadowOffsetY = 2 * pixelRatio;
      context.shadowBlur = 4.3 * pixelRatio;
      context.drawImage(image, x, y, drawWidth, drawHeight);
      context.restore();
    }

    setViewportHeight();

    const requestedNumber = Number.parseInt(new URLSearchParams(location.search).get('n'), 10);
    const imageNumber = Number.isInteger(requestedNumber) && requestedNumber >= 1 && requestedNumber <= 18
      ? requestedNumber
      : 1;
    const imageName = String(imageNumber).padStart(2, '0');
    const foregroundSrc = 'img/\u4eba\u7269\u98a8\u683c\u5716-05-' + imageName + '.png';

    let renderVersion = 0;

    async function buildComposite() {
      const currentVersion = ++renderVersion;

      try {
        const images = await Promise.all([loadImage(backgroundSrc), loadImage(foregroundSrc)]);
        if (currentVersion !== renderVersion) return;

        const width = window.innerWidth;
        const height = window.innerHeight;
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 3);
        compositeCanvas.width = Math.round(width * pixelRatio);
        compositeCanvas.height = Math.round(height * pixelRatio);
        const context = compositeCanvas.getContext('2d');
        drawCover(context, images[0], width, height, pixelRatio);
        drawForeground(context, images[1], width, height, pixelRatio);

        document.querySelector('.background').style.display = 'none';
        foreground.style.display = 'none';
        compositeCanvas.classList.add('ready');

        try {
          const compositeReady = new Promise((resolve, reject) => {
            composite.onload = resolve;
            composite.onerror = reject;
          });
          composite.src = compositeCanvas.toDataURL('image/png');
          await compositeReady;
          if (currentVersion !== renderVersion) return;

          composite.classList.add('ready');
          compositeCanvas.classList.remove('ready');
        } catch (exportError) {
          console.info('Canvas export is unavailable; displaying the same canvas directly.', exportError);
        }
      } catch (error) {
        console.error('Unable to load images for the canvas composition.', error);
      }
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
      setViewportHeight();
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(buildComposite, 120);
    });

    buildComposite();

  </script>
</body>
</html>
