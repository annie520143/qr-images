<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      --viewport-height: 100vh;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: var(--viewport-height);
      background: url("img/BACKGROUND.png") center / cover no-repeat;
    }

    .foreground {
      position: fixed;
      inset: 0;
      width: 100%;
      height: var(--viewport-height);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    .foreground.ready {
      opacity: 1;
    }

    .foreground img {
      display: block;
      width: auto;
      height: auto;
      max-width: 80vw;
      max-height: 90vh;
      max-height: 90dvh;
      object-fit: contain;
      filter: drop-shadow(2.98px 2.98px 4.92px rgba(0, 0, 0, 0.25));
    }

    #download {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 2;
      padding: 10px 16px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: rgba(0, 0, 0, 0.65);
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true"></div>
  <div class="foreground">
    <img id="p" alt="">
  </div>
  <button id="download" type="button">下載圖片</button>

  <script>
    const backgroundSrc = 'img/BACKGROUND.png';
    const foreground = document.querySelector('.foreground');
    const foregroundImage = document.getElementById('p');
    const downloadButton = document.getElementById('download');
    downloadButton.textContent = 'Download';

    function setViewportHeight() {
      document.documentElement.style.setProperty('--viewport-height', window.innerHeight + 'px');
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
      });
    }

    function drawCover(context, image, width, height) {
      const scale = Math.max(width / image.naturalWidth, height / image.naturalHeight);
      const drawWidth = image.naturalWidth * scale;
      const drawHeight = image.naturalHeight * scale;
      context.drawImage(image, (width - drawWidth) / 2, (height - drawHeight) / 2, drawWidth, drawHeight);
    }

    function drawForeground(context, image, width, height) {
      const scale = Math.min(1, (width * 0.8) / image.naturalWidth, (height * 0.9) / image.naturalHeight);
      const drawWidth = image.naturalWidth * scale;
      const drawHeight = image.naturalHeight * scale;
      const x = (width - drawWidth) / 2;
      const y = (height - drawHeight) / 2;

      context.save();
      context.shadowColor = 'rgba(0, 0, 0, 0.25)';
      context.shadowOffsetX = 2.98;
      context.shadowOffsetY = 2.98;
      context.shadowBlur = 4.92;
      context.drawImage(image, x, y, drawWidth, drawHeight);
      context.restore();
    }

    setViewportHeight();
    window.addEventListener('resize', setViewportHeight);

    const requestedNumber = Number.parseInt(new URLSearchParams(location.search).get('n'), 10);
    const imageNumber = Number.isInteger(requestedNumber) && requestedNumber >= 1 && requestedNumber <= 16
      ? requestedNumber
      : 1;
    const imageName = String(imageNumber).padStart(2, '0');
    const foregroundSrc = 'img/\u4eba\u7269\u98a8\u683c\u5716-05-' + imageName + '.png';

    foregroundImage.onload = async () => {
      if (foregroundImage.decode) {
        try {
          await foregroundImage.decode();
        } catch (error) {
          // The image can still be displayed when decode is unavailable.
        }
      }
      requestAnimationFrame(() => {
        requestAnimationFrame(() => foreground.classList.add('ready'));
      });
    };
    foregroundImage.src = foregroundSrc;

    downloadButton.addEventListener('click', async () => {
      downloadButton.disabled = true;
      downloadButton.textContent = 'Preparing...';
      try {
        const images = await Promise.all([loadImage(backgroundSrc), loadImage(foregroundSrc)]);
        const width = window.innerWidth;
        const height = window.innerHeight;
        const scale = Math.min(window.devicePixelRatio || 1, 3);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        const context = canvas.getContext('2d');
        context.scale(scale, scale);
        drawCover(context, images[0], width, height);
        drawForeground(context, images[1], width, height);
        canvas.toBlob((blob) => {
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'portrait-' + imageName + '.png';
          link.click();
          URL.revokeObjectURL(link.href);
        }, 'image/png');
      } catch (error) {
        alert('Image loading failed. Download is temporarily unavailable.');
      } finally {
        downloadButton.disabled = false;
        downloadButton.textContent = 'Download';
      }
    });
  </script>
</body>
</html>
