<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      --viewport-height: 100vh;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: var(--viewport-height);
      background: url("img/BACKGROUND.png") center / cover no-repeat;
    }

    .foreground {
      position: fixed;
      inset: 0;
      width: 100%;
      height: var(--viewport-height);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    .foreground.ready {
      opacity: 1;
    }

    .foreground img {
      display: block;
      width: auto;
      height: auto;
      max-width: 80vw;
      max-height: 90vh;
      max-height: 90dvh;
      object-fit: contain;
      filter: drop-shadow(3px 2px 4.3px rgba(0, 0, 0, 0.25));
    }

    .composite {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: none;
      width: 100%;
      height: var(--viewport-height);
      object-fit: fill;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: default;
    }

    .composite.ready {
      display: block;
    }

    #download {
      display: none;
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 2;
      padding: 10px 16px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: rgba(0, 0, 0, 0.65);
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true"></div>
  <div class="foreground">
    <img id="p" alt="">
  </div>
  <img id="composite" class="composite" alt="">
  <button id="download" type="button">下載圖片</button>

  <script>
    const backgroundSrc = 'img/BACKGROUND.png';
    const foreground = document.querySelector('.foreground');
    const foregroundImage = document.getElementById('p');
    const composite = document.getElementById('composite');

    function setViewportHeight() {
      document.documentElement.style.setProperty('--viewport-height', window.innerHeight + 'px');
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
      });
    }

    function drawCover(context, image, width, height) {
      const scale = Math.max(width / image.naturalWidth, height / image.naturalHeight);
      const drawWidth = image.naturalWidth * scale;
      const drawHeight = image.naturalHeight * scale;
      context.drawImage(image, (width - drawWidth) / 2, (height - drawHeight) / 2, drawWidth, drawHeight);
    }

    function drawForeground(context, image, width, height) {
      const scale = Math.min(1, (width * 0.8) / image.naturalWidth, (height * 0.9) / image.naturalHeight);
      const drawWidth = image.naturalWidth * scale;
      const drawHeight = image.naturalHeight * scale;
      const x = (width - drawWidth) / 2;
      const y = (height - drawHeight) / 2;

      context.save();
      context.filter = 'drop-shadow(3px 2px 4.3px rgba(0, 0, 0, 0.25))';
      context.drawImage(image, x, y, drawWidth, drawHeight);
      context.restore();
    }

    setViewportHeight();
    window.addEventListener('resize', setViewportHeight);

    const requestedNumber = Number.parseInt(new URLSearchParams(location.search).get('n'), 10);
    const imageNumber = Number.isInteger(requestedNumber) && requestedNumber >= 1 && requestedNumber <= 16
      ? requestedNumber
      : 1;
    const imageName = String(imageNumber).padStart(2, '0');
    const foregroundSrc = 'img/\u4eba\u7269\u98a8\u683c\u5716-05-' + imageName + '.png';

    async function buildComposite() {
      try {
        const images = await Promise.all([loadImage(backgroundSrc), loadImage(foregroundSrc)]);
        const width = window.innerWidth;
        const height = window.innerHeight;
        const scale = Math.min(window.devicePixelRatio || 1, 3);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        const context = canvas.getContext('2d');
        context.scale(scale, scale);
        drawCover(context, images[0], width, height);
        drawForeground(context, images[1], width, height);

        const compositeReady = new Promise((resolve, reject) => {
          composite.onload = resolve;
          composite.onerror = reject;
        });
        composite.src = canvas.toDataURL('image/png');
        await compositeReady;
        document.querySelector('.background').style.display = 'none';
        foreground.style.display = 'none';
        composite.classList.add('ready');
      } catch (error) {
        foregroundImage.src = foregroundSrc;
        foreground.classList.add('ready');
      }
    }

    buildComposite();

  </script>
</body>
</html>
