<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
img{display:block;width:100%;height:100vh;height:100dvh;height:var(--viewport-height,100vh);object-fit:cover;object-position:center}</style></head>
<body><img id="p"><script>
function setViewportHeight(){document.documentElement.style.setProperty('--viewport-height',window.innerHeight+'px')}
setViewportHeight();
window.addEventListener('resize',setViewportHeight);
document.getElementById('p').src='img/'+new URLSearchParams(location.search).get('n')+'.png';
</script></body></html>
